[package]
name = "relay-native"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1.0"
base64 = "0.23"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["remote_desktop", "screencast"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
libc = "0.2"
