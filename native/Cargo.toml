[package]
name = "relay-native"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1.0"
base64 = "0.23"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["remote_desktop", "screencast"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "=2.0.1"
png = "=0.18.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_Xps", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.62.2", features = ["Win32_System_WinRT"] }
